name: Update Rates

on:
  schedule:
    - cron: '0 0 * * *'   # 3:00 по Минску — обновление БД
    - cron: '0 7 * * *'   # 10:00 по Минску — рассылка уведомлений
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: update или notify'
        required: true
        default: 'update'
        type: choice
        options:
          - update
          - notify

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install playwright requests beautifulsoup4 sqlalchemy psycopg[binary] aiogram
          playwright install chromium
      - name: Run updater
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "notify" ] || [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            python notifier.py
          else
            python updater.py
          fi